name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Install clippy
        run: rustup component add clippy

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --all-features --locked --verbose
      - name: Build binary for smoke tests
        run: cargo build --bins --release

      - name: Run smoke tests (incremental_index)
        run: |
          git --version
          cd rust_indexer
          cargo test --test smoke_incremental_git -- --nocapture

      - name: Verify commit messages
        run: |
          if [ -f ./scripts/verify_commit_msgs.sh ]; then
            chmod +x ./scripts/verify_commit_msgs.sh || true
            ./scripts/verify_commit_msgs.sh || true
          fi
