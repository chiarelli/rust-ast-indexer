name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target
        uses: actions/cache@v4
        with:
          path: |
            target
            rust_indexer/target
          key: cargo-target-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          override: true

      - name: Install rustfmt
        if: runner.os != 'Windows'
        run: rustup component add rustfmt

      - name: Install clippy
        if: runner.os != 'Windows'
        run: rustup component add clippy

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --all-features --locked --verbose

      - name: Build binary for smoke tests
        run: cargo build --bins --release

      - name: Run smoke tests (incremental_index)
        run: |
          git --version
          cd rust_indexer
          cargo test --test smoke_incremental_git -- --nocapture

      - name: Verify commit messages
        run: |
          if [ -f ./scripts/verify_commit_msgs.sh ]; then
            chmod +x ./scripts/verify_commit_msgs.sh || true
            ./scripts/verify_commit_msgs.sh || true
          fi
