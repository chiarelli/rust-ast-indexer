services:
  dev:
    image: vsc-crush:1.0
    container_name: crush-dev
    volumes:
      - ..:/workspace:shared
      - ./kilo:/home/vscode/.local/share/kilo
      - ${HOME}/.config/kilo:/home/vscode/.config/kilo:ro
      - ${HOME}/.kilo:/home/vscode/.kilo:ro
    command: sleep infinity

volumes:
  qdrant_data:
    driver: local
