[package]
name = "rust_indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.9"
blake3 = "1.3"
num_cpus = "1.16"
walkdir = "2.3"
globset = "0.4"
dashmap = "5.4"

# Tree-sitter for parsing (optional languages)
tree-sitter = "0.20"
# tree-sitter-rust used for ParserPool in tests and parsing scaffolding
# optional for other languages; kept as dev-dependency to avoid forcing native linkage in CI
# dev-dependencies listed below

# add tree-sitter-rust as optional feature during CI/dev
[features]
parsing = ["tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-java"]

[dependencies.tree-sitter-rust]
version = "0.20"
optional = true

[dependencies.tree-sitter-javascript]
version = "0.20"
optional = true

[dependencies.tree-sitter-java]
version = "0.20"
optional = true



[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"
tempfile = "3.6"


[package.metadata]
authors = ["provisory"]
